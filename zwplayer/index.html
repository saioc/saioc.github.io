<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>全能在线视频播放器</title>
  <meta name="description" content="免费的纯前端在线视频播放器。无需下载安装任何插件，直接在浏览器中极速播放本地视频、MP4、WebM、HLS、DASH、WebRTC 实时流。支持免插件播放 RTSP 安防视频流，内置防盗播水印、多语种字幕加载与 AI 字幕翻译、章节搜索导航功能。">
  <meta name="keywords" content="在线视频播放器, 免费播放器, 网页播放器, HLS播放器, DASH播放器, RTSP播放器">

  <script defer src="/zwplayer/zwplayer.js?v=3.3.2"></script>
  <script type="module" crossorigin src="/zwplayer/videoplayer.js"></script>
  <link rel="stylesheet" crossorigin href="/zwplayer/videoplayer.css">
<body>

  <div class="landing-container">
    <!-- Main Video Section -->
    <section class="main-player-section">
      <div class="video-container" id="videoContainer">
        <div id="videoEl" style="max-width: 100%;width: 100%;height: 100%;padding-top: 25%;"></div>
      </div>
    </section>

    <div class="mobile-backdrop" id="mobileBackdrop"></div>
    <div class="id-setting">
		<svg id="globalSettingsIcon" class="tab-setting" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
	</div>
    <section id="tabs-section" class="tabs-section">
      <div class="sidebar-tabs">
        <div class="sidebar-tab active" data-tab="home">
          <svg class="tab-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span data-i18n="tab.home">首页</span>
        </div>
        <div class="sidebar-tab" data-tab="input">
          <svg class="tab-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
          <span data-i18n="tab.input">输入</span>
        </div>
        <div class="sidebar-tab" data-tab="favorites">
          <svg class="tab-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          <span data-i18n="tab.favorites">收藏</span>
        </div>
        <div class="sidebar-tab" data-tab="playlist">
          <svg class="tab-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          <span data-i18n="tab.playlist">历史</span>
        </div>
      </div>
	  
      <div class="sidebar-body">
        <div id="inputPanel">
      <div class="controls-bar">
        <div class="omni-bar-container">
          <div class="main-input-group">
            <div class="url-input-wrapper">
              <input type="text" id="videoUrlInput" data-i18n-placeholder="url.placeholderRemote" placeholder="输入视频 URL (http/https/webrtc/rtsp)...">
            </div>
            <button id="btnClearUrl" class="btn-clear-url" aria-label="Clear">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
          <div class="action-buttons-row">
            <label class="btn-action checkbox-live">
              <input type="checkbox" id="chkLive">
              <span data-i18n="form.live">直播</span>
            </label>
            <button class="btn btn-action btn-secondary" id="btnLoadFile">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
              <span data-i18n="btn.loadFile">文件</span>
            </button>
            <button class="btn btn-action btn-fav" id="btnFav">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
              <span data-i18n="form.fav">收藏</span>
            </button>
            <button class="btn btn-action btn-secondary" id="btnShare">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
              <span data-i18n="btn.share">分享</span>
            </button>
            <button class="btn-action primary-action" id="btnLoadUrl">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
              <span data-i18n="btn.play">播放</span>
            </button>
            <input type="file" id="videoFileInput" accept="video/*,.mp4,.webm,.ogg,.ogv,.mov,.mkv,.m4v,audio/*,.flac,.wav,.m4a,.mp3,.opus,.vtt,.webvtt,.srt,.json,.bcc" multiple style="display:none">
          </div>
        </div>
      </div>
        </div>
        <div id="playlistPanel" style="display:none">
          <div class="table-header-ops">
            <label class="auto-save-switch">
              <span data-i18n="table.autoSave">自动保存</span>
              <input type="checkbox" id="chkAutoSave" checked>
            </label>
            <button class="btn-flat" id="btnClearHistory" data-i18n="table.deleteAll">清空</button>
          </div>
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th data-i18n="table.date">日期</th>
                  <th data-i18n="table.title">标题</th>
                  <th data-i18n="table.url">链接</th>
                  <th data-i18n="table.op">操作</th>
                </tr>
              </thead>
              <tbody id="historyTbody">
                <tr><td colspan="4" class="empty-cell" data-i18n="playlist.empty">暂无历史记录。</td></tr>
              </tbody>
            </table>
          </div>
          <div class="bottom-notes">
            <div class="table-note" data-i18n="table.sameUrlKeep">注：相同链接只保留最近一次记录；本地文件刷新后即失效。</div>
          </div>
        </div>

        <!-- Favorites Panel -->
        <div id="favoritesPanel" style="display:none">
          <div class="table-header-ops" style="justify-content: flex-end;">
            <button class="btn-flat" id="btnClearFavs" data-i18n="table.deleteAll">清空</button>
          </div>
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th data-i18n="table.date">日期</th>
                  <th data-i18n="table.title">标题</th>
                  <th data-i18n="table.url">链接</th>
                  <th data-i18n="table.op">操作</th>
                </tr>
              </thead>
              <tbody id="favsTbody">
                <tr><td colspan="4" class="empty-cell" data-i18n="favorites.empty">暂无收藏。</td></tr>
              </tbody>
            </table>
          </div>
          <div class="bottom-notes">
            <div class="table-note" data-i18n="collect.tip">注：相同链接只保留最近一次收藏记录。</div>
          </div>
        </div>
        
        
      </div>
    </section>

   
  </div>



  <!-- Edit Title Dialog (Hidden) -->
  <dialog id="editDialog">
    <div class="dialog-content">
      <h3 data-i18n="form.editTitle">编辑</h3>
      <label class="dialog-label" data-i18n="form.titleLabel" for="editTitleInput">标题</label>
      <input type="text" id="editTitleInput" data-i18n-placeholder="form.editTip" placeholder="请输入新的标题" />
      <label class="dialog-label" data-i18n="form.urlLabel" for="editUrlInput">链接</label>
      <textarea id="editUrlInput" rows="3" data-i18n-placeholder="form.urlTip" placeholder="请输入视频链接"></textarea>
      <div class="dialog-actions">
        <button id="btnCancelEdit" class="btn-action btn-secondary" data-i18n="form.cancel">取消</button>
        <button id="btnConfirmEdit" class="btn-action primary-action" data-i18n="form.ok">确定</button>
      </div>
    </div>
  </dialog>

  <!-- Share Dialog (Hidden) -->
  <dialog id="shareDialog">
    <div class="dialog-content share-dialog-content">
      <button type="button" class="share-close-x" id="shareCloseX" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <h3 data-i18n="share.title">分享视频</h3>
      <div class="share-qr-wrap">
        <canvas id="shareQr" class="share-qr"></canvas>
        <div id="shareQrError" class="share-qr-error" data-i18n="share.qrError" style="display:none;">二维码生成失败，请直接复制链接</div>
      </div>
      <div class="share-scan-tip" data-i18n="share.scanTip">扫码在手机上打开</div>
      <label class="dialog-label" data-i18n="share.urlLabel" for="shareUrlInput">分享链接</label>
      <div class="share-url-row">
        <input type="text" id="shareUrlInput" readonly>
        <button type="button" class="btn-action btn-secondary" id="btnCopyShare" data-i18n="share.copy">复制链接</button>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn-action btn-secondary" id="btnCloseShare" data-i18n="share.close">关闭</button>
      </div>
    </div>
  </dialog>


<script>
    document.addEventListener('DOMContentLoaded', () => {
      const videoContainer = document.getElementById('videoContainer');
      const iconElement = document.getElementById('globalSettingsIcon');
      const targetDiv = document.getElementById('tabs-section');

      /* ----------------------------------------------------
       * 1. 动态计算并将真视口高度赋予 #videoContainer
       * ---------------------------------------------------- */
      function setVideoContainerHeight() {
        // 计算当前真实可见高度的 1% (1vh)
        const vh = window.innerHeight * 0.01;
        
        // 方式一：更新 CSS 变量（CSS 里的 height: calc(var(--vh, 1vh) * 100) 会自动起效）
        document.documentElement.style.setProperty('--vh', `${vh}px`);
        
        // 方式二：直接用 JS 给 #videoContainer 赋真实的内联高度 px
        if (videoContainer) {
          videoContainer.style.height = `${window.innerHeight}px`;
        }
      }

      // 初始化计算并绑定窗口缩放、方向旋转事件
      setVideoContainerHeight();
      window.addEventListener('resize', setVideoContainerHeight);
      window.addEventListener('orientationchange', setVideoContainerHeight);

      /* ----------------------------------------------------
       * 2. 点击网页：切换齿轮图标的显示/隐藏
       * ---------------------------------------------------- */
      document.addEventListener('click', (event) => {
        // 点击设置面板内部不收起
        if (targetDiv.contains(event.target)) {
          return;
        }

        // 图标处于显示状态时点击空白处，关闭设置面板
        if (iconElement.classList.contains('show')) {
          targetDiv.classList.remove('active');
        }

        // 切换图标本身的显示状态
        iconElement.classList.toggle('show');
      });

      /* ----------------------------------------------------
       * 3. 点击图标：控制设置面板显示/隐藏
       * ---------------------------------------------------- */
      iconElement.addEventListener('click', (event) => {
        event.stopPropagation(); // 阻止冒泡
        targetDiv.classList.toggle('active');
      });
    });
  </script>
  <script defer src="./zwplayer/qrcode.min.js"></script>
</body>
</html>
